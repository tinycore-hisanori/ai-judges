<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Judges</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <div class="top-controls">
      <label class="verdict-lang">
        <span data-i18n="verdictLangLabel">Verdicts in</span>
        <select id="verdictLang">
          <option value="auto" data-i18n="verdictLangAuto">Auto (language of the pitch)</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>
      </label>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="ja" aria-pressed="false">JA</button>
      </div>
    </div>

    <header class="masthead">
      <h1 data-i18n="title">AI Judges</h1>
      <p class="tagline" data-i18n="tagline">Three judges. One pitch. Rewrite until they change their minds.</p>
    </header>

    <div id="banner" class="banner" data-i18n="banner" hidden>Can't reach the local model. Is Ollama running?</div>

    <section id="panel" class="panel" aria-label="Judging panel"></section>

    <section class="pitch">
      <textarea id="pitch" rows="6" placeholder="Paste your pitch — 3 to 5 lines"></textarea>
      <div id="counter" class="counter">0 characters</div>
      <details id="submission" class="submission">
        <summary data-i18n="attachTitle">Attach your submission (optional)</summary>
        <fieldset id="submissionFields">
          <p class="hint" data-i18n="attachHint">The judges read these only when at least one document has text.</p>
          <div id="attachments" class="attachments"></div>
          <label class="criteria-field">
            <span data-i18n="criteriaLabel">Judging criteria</span>
            <textarea id="criteria" rows="5"></textarea>
          </label>
          <div id="totalCounter" class="counter"></div>
        </fieldset>
      </details>
      <div class="controls">
        <button id="submit" class="btn primary" disabled>Submit to the panel</button>
        <button id="newPitch" class="btn ghost" data-i18n="newPitch">New pitch</button>
      </div>
    </section>

    <section id="badge" class="badge empty" aria-live="polite"></section>
  </main>
  <footer id="appFooter" class="app-footer"></footer>

  <script type="module" src="app.js"></script>
</body>
</html>
